[build-system]
requires = ["setuptools>=40", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regenerable-architecture"
version = "0.1.0"
description = "Demonstration of Regenerable Architecture: durable intent, disposable implementation."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["examples*", "fitness_functions*"]

[tool.pytest.ini_options]
testpaths = ["examples"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["examples"]
omit = ["*/tests/*", "*/fitness/*"]
