# system.yaml
#
# System manifest — regenerable-architecture example system.
#
# This is a DURABLE system-level artifact. It is the authoritative source
# for capsule ownership, dependency relationships, data classification, and
# governance state. Update it when capsules are added, removed, or re-owned,
# when dependency relationships or data classifications change, or when a
# capsule advances through lifecycle maturity levels.
#
# Field reference:
#
#   name              unique identifier
#   path              location relative to repository root
#   owner             team accountable for durable artifact maintenance
#   lifecycle_level   adoption maturity (0–5); see docs/adoption-maturity-model.md
#   provides          human-readable description of the business capability
#   inbound_contract  path to OpenAPI spec (relative to capsule path)
#   inbound_version   currently published contract version
#   data_owned        data classification per category:
#                       canonical — authoritative record; must survive regeneration
#                       derived   — rebuildable from inputs; safe to discard
#                       ephemeral — short-lived; loss is acceptable
#   slos              operational expectations this capsule must meet
#   consumers         capsules that declare a dependency on this capsule (reverse index;
#                     keep in sync with depends_on entries below)
#   depends_on        outbound dependencies with consumed operations and fields
#
# The manifest enables:
#
#   Bidirectional graph   — depends_on and consumers together let you traverse
#                           the dependency graph in either direction
#   Impact analysis       — before regenerating capsule X, check X.consumers;
#                           each consumer must re-run its post_regeneration_checks
#   Safe sequencing       — regenerate capsules with empty depends_on first,
#                           then their dependents in dependency order
#   Contract gate         — the regenerated inbound_contract must remain
#                           compatible with every consumer's declared version
#                           and fields_consumed before deployment
#   Data governance       — canonical data must be migrated before the
#                           implementation is discarded; derived data need not be
#   Governance visibility — owner and lifecycle_level make accountability
#                           and readiness visible without reading code

capsules:

  - name: pricing-discount-capsule
    path: examples/pricing-discount-capsule
    owner: pricing-team
    lifecycle_level: 4              # regeneration-ready; see adoption-maturity-model.md
    provides: >-
      Calculates discount percentage and explanation for a customer basket,
      based on customer tier and active campaign status. Stateless — no
      persistent data.
    inbound_contract: ports/inbound/openapi.yaml
    inbound_version: "1.0"
    data_owned:
      canonical: []                 # stateless capsule — no authoritative records
      derived:
        - name: discount_result
          description: >-
            Computed discount for a given basket input. Rebuildable from inputs
            on demand; no durability requirement.
      ephemeral: []
    slos:
      latency_p99_ms: 50
      error_rate_max_percent: 0.1
      throughput_rps_min: 500
    consumers:
      - name: order-capsule
        version: "1.0"             # version this consumer has declared
    depends_on: []

  - name: order-capsule
    path: examples/order-capsule
    owner: commerce-team
    lifecycle_level: 3              # behavioral tests in place; recipe not yet written
    provides: >-
      Places customer orders with discount applied and retrieves order history.
      Owns the authoritative order record.
    inbound_contract: ports/inbound/openapi.yaml
    inbound_version: "1.0"
    data_owned:
      canonical:
        - name: order_record
          description: >-
            Authoritative record of a placed order including line items,
            applied discount, and customer reference.
          migration_required_on_regeneration: true
          migration_note: >-
            Export order records before discarding the implementation.
            Re-import after regeneration is verified. See regeneration-recipe.md.
      derived:
        - name: discounted_total
          description: >-
            Total price after discount applied. Computable from order_record
            and a live call to pricing-discount-capsule; safe to discard.
      ephemeral: []
    slos:
      latency_p99_ms: 200
      error_rate_max_percent: 0.5
      throughput_rps_min: 200
    consumers: []
    depends_on:
      - capsule: pricing-discount-capsule
        version: "1.0"
        operations:
          - name: calculateDiscount
            fields_consumed:
              - discount_percentage  # stored on the order record
              - explanation          # stored for audit and display
        why: >-
          Determines the discount percentage before recording an order.
          The explanation is stored with the order record for audit purposes
          and surfaced in order confirmation messages.
        post_regeneration_checks:
          - tests/test_integration.py

